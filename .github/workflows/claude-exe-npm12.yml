name: claude-exe-npm12
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        npm: [11, 12]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: ./claude-exe-npm12/run.ps1
        env:
          NPM_MAJOR: ${{ matrix.npm }}
        shell: pwsh
