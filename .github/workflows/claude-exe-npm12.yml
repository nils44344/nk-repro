name: claude-exe-npm12
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: ./claude-exe-npm12/run.ps1
        shell: pwsh
