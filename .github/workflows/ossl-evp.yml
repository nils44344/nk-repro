name: ossl-evp
on: workflow_dispatch
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: W=$RUNNER_TEMP/work CRA=$([ ${{ matrix.node }} -ge 22 ] && echo 1 || echo 0) bash ossl-evp/run.sh
