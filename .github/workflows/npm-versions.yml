name: npm-versions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  invalid-version:
    strategy:
      matrix:
        npm: ['11', '12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: W=$RUNNER_TEMP/work NPM=${{ matrix.npm }} bash npm-versions/invalid-version.sh
  ebadengine:
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.0', '22.12.0', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: W=$RUNNER_TEMP/work bash npm-versions/ebadengine.sh
