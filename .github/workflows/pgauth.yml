# Postgres "password authentication failed for user": Docker volume, env file quotes, URL characters, a second server.
name: pgauth
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash pgauth/run.sh
