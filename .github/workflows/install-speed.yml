name: install-speed
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rounds: 3 }
          - { os: windows-latest, rounds: 1 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: W=$RUNNER_TEMP/work ROUNDS=${{ matrix.rounds }} bash install-speed/run.sh
