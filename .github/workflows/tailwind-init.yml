name: tailwind-init
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: W=$RUNNER_TEMP/work bash tailwind-init/run.sh
