# Docker "permission denied ... docker.sock": group membership, old shells, chmod 666, daemon stopped.
name: dockerperm
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash dockerperm/run.sh
