# Prisma P2002 "Unique constraint failed on the fields": every way to hit it, on Postgres and SQLite.
name: p2002
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash p2002/run.sh
