# Prisma P2002 "Unique constraint failed on the fields": every way to hit it, on Postgres and SQLite.
name: p2002
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == '26'
        run: npm install -g npm@12 --no-audit --no-fund --loglevel=error
      - run: bash p2002/run.sh
