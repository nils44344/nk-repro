name: prisma6-noinit
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - shell: bash
        run: W=$RUNNER_TEMP/work bash prisma6-noinit/run.sh
