name: vite-alias
on:
  workflow_dispatch:
    inputs:
      vers:
        description: 'Vite versions for the dev server and Vitest follow-up (versions.sh)'
        default: '8.3.0 8.3.5 8.3.7'
permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - shell: bash
        run: W=$RUNNER_TEMP/work bash vite-alias/run.sh
      - shell: bash
        env:
          VERS: ${{ inputs.vers }}
        run: W=$RUNNER_TEMP/work bash vite-alias/versions.sh
