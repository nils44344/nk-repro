name: libatomic2
on: workflow_dispatch
jobs:
  run:
    strategy: { matrix: { os: [ubuntu-latest, ubuntu-24.04-arm] } }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: libatomic } }
    steps:
      - uses: actions/checkout@v4
      - name: arm64 official binary vs clean image
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          v=$(curl -s https://nodejs.org/dist/index.json | jq -r '[.[]|select(.version|startswith("v26."))][0].version')
          curl -sSLO https://nodejs.org/dist/$v/node-$v-linux-arm64.tar.xz && tar -xJf node-$v-linux-arm64.tar.xz
          readelf -d node-$v-linux-arm64/bin/node | grep libatomic
          docker run --rm -v $PWD:/w debian:bookworm-slim /w/node-$v-linux-arm64/bin/node -v || echo "exit=$?"
      - run: bash run2.sh 2>&1 | tee out-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with: { name: "out2-${{ matrix.os }}", path: "libatomic/out-*.txt" }
