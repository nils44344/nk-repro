# npm EACCES: global installs, root-owned cache after sudo, Docker non-root user.
name: eacces
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo chmod 755 "$(dirname "$(dirname "$(command -v node)")")" ; bash eacces/run3.sh
