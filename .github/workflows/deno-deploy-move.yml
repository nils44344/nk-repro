name: deno-deploy-move
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: W=$RUNNER_TEMP/work bash deno-deploy-move/run.sh
