name: ts7-frameworks
on:
  workflow_dispatch:
    inputs:
      fws: { required: false, default: '["next", "angular", "vue", "nest", "nuxt", "svelte", "astro"]' }
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        fw: ${{ fromJSON(inputs.fws || '["next", "angular", "vue", "nest", "nuxt", "svelte", "astro"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: W=$RUNNER_TEMP/work FW=${{ matrix.fw }} bash ts7-frameworks/${{ matrix.fw == 'astro-debug' && 'astro-debug.sh' || 'run.sh' }}
