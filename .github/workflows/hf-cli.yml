name: hf-cli
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: W=$RUNNER_TEMP/work bash hf-cli/run.sh
      - run: W=$RUNNER_TEMP/work2 bash hf-cli/click.sh
