# npm/Node behind a TLS-inspecting proxy with an untrusted root CA: errors and fixes, on Windows and Linux.
name: certs
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['24.14.0', '26']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == '26'
        run: npm install -g npm@12 --no-audit --no-fund --loglevel=error
      - run: bash certs/run.sh
