# Python 3.15 vs 3.14: plain pip install of the packages without 3.15 wheels, on clean Windows and Linux runners.
name: py315
on: workflow_dispatch
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.15', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python py315/check.py
      - name: Fix test, PyO3 forward compatibility (langchain needs ormsgpack, built with PyO3)
        if: matrix.python == '3.15'
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
        run: python py315/check.py ormsgpack langchain
