name: anthropic-sdk2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: W=$RUNNER_TEMP/work bash anthropic-sdk2/run.sh
