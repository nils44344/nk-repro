name: bun-vs-node
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.3', 'latest']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: W=$RUNNER_TEMP/work bash bun-vs-node/run.sh
