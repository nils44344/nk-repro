# Temporary: dry-runs new reverify checks before they join the nightly job. Never fails (no mail); read the log.
name: reverify-try
on: workflow_dispatch
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node reverify/pnpm12.mjs || true
      - run: node reverify/ts18046.mjs || true
