name: eacces-npm12
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        npm: ['11', '12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo chmod 755 "$(dirname "$(dirname "$(command -v node)")")" ; NPM_V=${{ matrix.npm }} bash eacces/run4.sh
