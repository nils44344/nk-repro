name: require-esm
on: workflow_dispatch
permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22.11.0', '22.12.0', '24', '26']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: W=$RUNNER_TEMP/work bash require-esm/run.sh
