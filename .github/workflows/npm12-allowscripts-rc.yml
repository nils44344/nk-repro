name: npm12-allowscripts-rc
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: W="$RUNNER_TEMP/work" bash npm12-allowscripts-rc/run.sh
