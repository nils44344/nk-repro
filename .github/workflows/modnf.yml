# ModuleNotFoundError although installed: two Pythons, venvs, Jupyter kernels, install-name mismatches.
name: modnf
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash modnf/run.sh
