name: py310-to-314
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.14
      - run: W=$RUNNER_TEMP/work bash py310-to-314/run.sh
